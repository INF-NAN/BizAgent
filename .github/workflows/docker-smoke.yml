name: docker-smoke
# Phase 14 (owner decision D15): build the compose stack, start it without the gpu profile, run the
# scripted mock demo (query -> write -> approval -> done) over the HTTP API, print image sizes and
# the cold-start time, then stop the stack. See scripts/docker_smoke.py and docs/verification/.
on:
  push:
    branches: [phase9-verification, main]
jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # the image copies third_party/agent-world-model
      - name: build, start, smoke, stop
        run: python3 scripts/docker_smoke.py
