# results/registry.yaml — DRAFT (Phase 0)
#
# The ONLY place in this repository where model-performance numbers may live (rule R3).
# Every value here is a paper-reported number, measured by the official models on the
# official evaluation harnesses. None of them is a measurement of this repository's
# application layer (agent, gateway, memory, services), which has never been benchmarked.
#
# Phase 0 status:
#   The arXiv PDF could not be opened: arxiv.org is blocked by this environment's egress
#   policy (curl: "CONNECT tunnel failed, response 403"; WebFetch: EGRESS_BLOCKED).
#   Therefore EVERY entry is `verified: false`, and version / table / row / column are
#   null. The values below were transcribed verbatim from TASK.md section 1.4 and must be
#   checked cell by cell against the PDF before anything cites them.
#
# Field contract (kept stable for the Phase 8 number guard):
#   id            unique key: <benchmark>.<metric>.<size>.<base|awm>
#   value         number as a float; `printed` keeps the paper's textual precision
#   source        arxiv_id, version, table, row, column, plus where the value was transcribed from
#   verified      true only after a human-readable check against the PDF table cell

schema_version: 1

disclaimer: "论文报告值，由官方模型在官方评测 harness 上测得，不是本仓库应用层的测量结果。"

