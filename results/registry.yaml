# results/registry.yaml
#
# The ONLY place in this repository where model-performance numbers may live (rule R3).
# Every value here is a paper-reported number, measured by the official models on the
# official evaluation harnesses. None of them is a measurement of this repository's
# application layer (agent, gateway, memory, services), which has never been benchmarked.
#
# Phase 10 (2026-09-24): every entry was checked against arXiv 2602.10090 v3, Table 4, in
# both the HTML rendering and the PDF (page 7); evidence in
# docs/verification/2026-09-24-paper-table4.md. Only the Base and AWM rows are recorded,
# for complete rows of the selected columns (no cherry-picking; cells where AWM is below
# Base are included). The Simulator and EnvScaler rows are deliberately not recorded.
#
# Field contract (enforced by src/workbench/results/registry.py):
#   id            unique key: <benchmark>.<metric>.<size>.<base|awm>
#   value         number as a float; `printed` keeps the paper's textual precision
#   unit          score | pass rate (%) | success rate (%)
#   source        arxiv_id, version, table, row, column (+ page, transcribed_from)
#   verified      true only after a check against the paper table cell; verified entries
#                 also need verified_by, verified_at and an existing evidence file

schema_version: 2

disclaimer: "论文报告值，由官方模型在官方评测 harness 上测得，不是本仓库应用层的测量结果。"

paper:
  arxiv_id: "2602.10090"
  title: "Agent World Model: Infinity Synthetic Environments for Agentic Reinforcement Learning"
  authors: "Zhaoyang Wang, Canwen Xu, Boyi Liu, Yite Wang, Siwei Han, Zhewei Yao, Huaxiu Yao, Yuxiong He"
  venue_claimed: "Accepted to ICML 2026 (arXiv comments field of the abstract page)"
  version_checked: v3
  version_date: "2026-05-22"
  pdf_accessed: true
  evidence: docs/verification/2026-09-24-paper-table4.md

# Notes that must accompany every rendering of these numbers (Table 4 caption and §5.1).
table_notes:
  - "Table 4 标题：Results across BFCLv3, τ²-bench, and MCP-Universe benchmarks. Best performance is in bold."
  - "BFCLv3 的 Hall. 指 hallucination 类别；数值为 BFCLv3 leaderboard 分数。"
  - "τ²-bench 的 Pass@k 指允许 k 次尝试的任务成功率；Pass@1 为 4 次运行的平均值。"
  - "MCP-Universe 报告任务成功率；论文排除了需要 GUI 的 3D design 任务，以及需要登录鉴权（GitHub、Notion）的 repository management 任务（§5.1）。"
  - "Base 行为未经额外训练的 Qwen3 thinking 模型（§5.1）；本表只登记 Base 与 AWM 两行，未登记 Simulator 与 EnvScaler 两个对比基线。"

# Model identities. Evidence: docs/verification/2026-09-24-model-cards.md.
# `presumed_identity` stays presumed: no model card states that the released checkpoint is
# the exact model behind the AWM rows of Table 4.
models:
  4b.base:
    label: "4B Base"
    presumed_identity: "Qwen3-4B thinking model without additional training (paper §5.1: Base = the original LLMs ... without additional training; Qwen3 thinking models across 4B, 8B, 14B as base agents)"
    verified: false
  4b.awm:
    label: "4B AWM"
    presumed_identity: >-
      Snowflake/Arctic-AWM-4B (HF sha 437dfa0). Card: apache-2.0, base_model Qwen/Qwen3-4B,
      "trained with agentic reinforcement learning on Qwen3-4B"; config Qwen3ForCausalLM,
      max_position_embeddings 40960. The card links the paper but does not say this
      checkpoint is the Table 4 AWM row.
    verified: false
  8b.base:
    label: "8B Base"
    presumed_identity: "Qwen3-8B thinking model without additional training (paper §5.1: Base = the original LLMs ... without additional training; Qwen3 thinking models across 4B, 8B, 14B as base agents)"
    verified: false
  8b.awm:
    label: "8B AWM"
    presumed_identity: >-
      Snowflake/Arctic-AWM-8B (HF sha 63ebcb9). Card: apache-2.0; text says "trained ... on
      Qwen3-8B" but the card metadata lists base_model Qwen/Qwen3-4B (inconsistent; config
      dims hidden_size 4096 / 36 layers match an 8B Qwen3); max_position_embeddings 40960.
      No statement that it is the Table 4 AWM row.
    verified: false
  14b.base:
    label: "14B Base"
    presumed_identity: "Qwen3-14B thinking model without additional training (paper §5.1: Base = the original LLMs ... without additional training; Qwen3 thinking models across 4B, 8B, 14B as base agents)"
    verified: false
  14b.awm:
    label: "14B AWM"
    presumed_identity: >-
      Snowflake/Arctic-AWM-14B (HF sha fa3e3b1). Card: apache-2.0; text says "trained ... on
      Qwen3-14B" but the card metadata lists base_model Qwen/Qwen3-4B (inconsistent; config
      dims hidden_size 5120 / 40 layers match a 14B Qwen3); max_position_embeddings 40960.
      No statement that it is the Table 4 AWM row.
    verified: false

