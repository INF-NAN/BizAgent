[project]
name = "bizagent-workbench"
version = "0.1.0"
description = "Deployable, auditable agent workbench around Agent World Model (AWM) MCP environments: isolated env sessions, a deny-first MCP gateway with approval policies and previews, a LangGraph agent, HTTP/SSE API and web UI."
readme = "README.md"
license = "MIT"  # this repository's own code; third_party/, datasets and models keep their own terms
authors = [{ name = "Yueyi Li" }]
requires-python = ">=3.12,<3.13"
keywords = ["agents", "mcp", "langgraph", "llm", "agent-world-model"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    # Upstream AWM, used through its Python interface and CLI (never copied; see docs/UPSTREAM.md).
    "agent-world-model",
    "mcp",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "typer>=0.15",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "prometheus-client>=0.21",
    "rich>=13",
    "huggingface-hub",  # `make data` downloads the official dataset (never committed)
]

[project.urls]
Homepage = "https://github.com/INF-NAN/BizAgent"
Repository = "https://github.com/INF-NAN/BizAgent"
Documentation = "https://github.com/INF-NAN/BizAgent/tree/main/docs"
Issues = "https://github.com/INF-NAN/BizAgent/issues"

[project.scripts]
workbench = "workbench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "detect-secrets==1.5.0",
    "pre-commit>=4",
]

[tool.uv]
# Keep the app environment on exactly the versions AWM's own uv.lock was tested with, so the
# upstream code runs on the dependency set it was built for (docs/UPSTREAM.md §8).
constraint-dependencies = [
    "mcp==1.26.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "starlette==0.46.2",
    "sse-starlette==3.0.3",
    "uvicorn==0.40.0",
    "httpx==0.28.1",
    "openai==2.38.0",
    "numpy==2.4.2",
    "anyio==4.12.1",
    "typer==0.21.1",
]

[tool.uv.sources]
agent-world-model = { path = "third_party/agent-world-model", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["third_party", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]  # B008: typer.Option defaults are idiomatic

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["workbench"]
exclude = ["third_party"]

[[tool.mypy.overrides]]
module = ["awm.*", "sse_starlette.*", "prometheus_client.*", "langgraph.*", "detect_secrets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: starts real AWM MCP server subprocesses on CPU (no GPU, no network)",
    "official_data: needs the official AgentWorldModel-1K dataset in data/awm1k (`make data`); skipped when absent",
]
