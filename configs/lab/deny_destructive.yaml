# Injection experiment, configuration B (docs/EXPERIMENTS.md): the same as eval_policy.yaml, plus
# a rule that refuses every destructive call, whoever asks for it.
version: 1
rules:
  - id: lab-deny-destructive
    description: No destructive call is executed during this run.
    risk: [destructive]
    decision: deny

  - id: lab-auto-write
    description: Batch evaluation approves write calls without a person.
    risk: [write]
    decision: auto_approve
