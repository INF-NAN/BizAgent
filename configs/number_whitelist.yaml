# Engineering numbers that look performance-like to the number guard but are not model
# metrics. Every entry needs a reason. Keep this list short. (Dependency specifiers such as
# `>=2.11` are skipped automatically.)
tokens:
  "3.10": Python version
  "3.11": Python version
  "3.12": Python version
  "3.13": Python version
  "3.14": Python version (vLLM requires <3.14)
  "0.19": vLLM version (0.19.0)
  "1.26": MCP Python SDK version (1.26.0)
  "24.04": Ubuntu version (GitHub-hosted runner image ubuntu-24.04, Ubuntu 24.04.5 LTS)
files:
  docs/verification/2026-09-24-phase14-synth-resilience.md:
    "15.69": wall-clock seconds of a pytest run, quoted verbatim from its output (not a metric)
  docs/verification/cost-ledger.md:
    "0.02": DeepSeek off-peak cache-hit input price in CNY per 1M tokens, quoted verbatim from the official pricing page (a price, not a metric)
    "0.04": DeepSeek peak cache-hit input price in CNY per 1M tokens, quoted verbatim from the official pricing page (a price, not a metric)
# Files the guard does not scan at all (ADR-028). Only the owner's task books belong here: they are
# kept verbatim, quote the forbidden wording as rules and carry the owner's own transcription of
# the paper's Table 4, which Phase 10 checked; the checked values live in results/registry.yaml.
skip_files:
  docs/process/TASK.md: the owner's task book (Phase 0-8), verbatim; its rule R3 quotes the forbidden wording
  docs/process/TASK_v2.md: the owner's task book (Phase 9-15), verbatim; §2.2 is the owner's transcription of Table 4
