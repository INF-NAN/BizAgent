# vLLM serving profile for Arctic-AWM-4B (Phase 4; tool parser enabled after Phase 12.5).
#
# UNVERIFIED-LOCAL: needs a CUDA GPU and network access to huggingface.co; to be checked on a GPU
# in Phase 15. The model card was read on 2026-09-24 (docs/verification/2026-09-24-model-cards.md):
# Qwen3ForCausalLM, max_position_embeddings 40960.
#
# Tool calling (owner decision D11, docs/DECISIONS.md ADR-020; sources in docs/RECON.md):
# - the model's chat_template.jinja (revision 437dfa0) asks for, and renders, tool calls as
#   <tool_call>\n{"name": ..., "arguments": {...}}\n</tool_call> (template lines 11 and 65-73);
# - vLLM v0.19.0's `hermes` parser extracts exactly that: JSON objects with "name" and
#   "arguments" between <tool_call> tags (tool_parsers/hermes_tool_parser.py:61-66, 106-126);
# - the workbench agent's act requests carry native `tools`, which vLLM rejects unless
#   --enable-auto-tool-choice and --tool-call-parser are set (render/serving.py:197-215);
# - requests WITHOUT `tools` (e.g. `awm agent`'s <tool_call> text protocol) keep tool_choice
#   "none" (chat_completion/protocol.py:175-181, 642-643), so the parser never runs on them and
#   the <tool_call> text stays in `content` (chat_completion/serving.py:1476-1479, 1752-1757).
# Values below were checked against vLLM v0.19.0 source (commit 2a69949, docs/RECON.md §10).
model: Snowflake/Arctic-AWM-4B
served_model_name: Snowflake/Arctic-AWM-4B
host: 127.0.0.1
port: 8000
# null -> vLLM derives it from the model config (vllm/config/model.py:182, default None)
max_model_len: null
# vLLM default is 0.9 (vllm/config/cache.py:41); kept explicit so it is visible
gpu_memory_utilization: 0.9
# Tool-calling flags (D11). `hermes` is registered in vLLM v0.19.0 (vllm/tool_parsers/__init__.py:61-64);
# --enable-auto-tool-choice requires a parser (vllm/entrypoints/openai/cli_args.py:363-364).
enable_auto_tool_choice: true
tool_call_parser: hermes
# Not set (not part of D11): thinking text stays in `content` and the workbench client strips it.
# `qwen3` is a registered reasoning parser (vllm/reasoning/__init__.py:83), unverified for this model.
reasoning_parser: null
chat_template: null           # use the model's own template
extra_args: []
